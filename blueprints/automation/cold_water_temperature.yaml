blueprint:
  name: Incoming water temperature — flow-qualified estimate
  description: >-
    Estimate incoming water temperature only after a configurable flush and a
    stable confirmation window after a water-use report. Works with ordinary Home Assistant
    sensor entities from any integration; MQTT is not required. Uses one
    input_text helper (maximum length 255) for all persistent state. Create
    the two display sensors with the companion package or template blueprints. Temperatures
    must be in °C; configure the conversion from the cumulative meter to litres.
    Use a dedicated helper for each automation instance. Version 1.2.0.
  domain: automation
  author: Andre Kuehne
  source_url: https://github.com/andrekuehne/ha_cold_water_temperature/blob/main/blueprints/automation/cold_water_temperature.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    sources:
      name: Source sensors and storage
      input:
        temperature_sensor:
          name: Raw water temperature
          description: Temperature in °C, including readings when water is idle.
          selector:
            entity:
              filter:
                domain: sensor
                device_class: temperature
        volume_sensor:
          name: Cumulative water volume
          description: A cumulative meter, not a daily utility meter or flow rate.
          selector:
            entity:
              filter:
                domain: sensor
        state_helper:
          name: Persistent state helper
          description: A dedicated Text helper with maximum length set to 255.
          selector:
            entity:
              filter:
                domain: input_text
        receipt_sensor:
          name: Last received timestamp (optional)
          description: >-
            A timestamp that changes for every received reading, including
            unchanged temperature and volume. Without it, updates from either
            source sensor establish continuity; long periods with unchanged
            values are conservatively treated as possible data gaps.
          default: []
          selector:
            entity:
              filter:
                domain: sensor
                device_class: timestamp
        litres_per_unit:
          name: Litres per volume unit
          description: Use 1000 for m³, 1 for litres, or 28.316847 for ft³.
          default: 1000
          selector:
            number:
              min: 0.001
              max: 1000000
              step: 0.001
              mode: box
    qualification:
      name: Measurement qualification
      input:
        sampling_mode:
          name: Meter reporting pattern
          description: >-
            Batched meters qualify a flushed reading using subsequent fresh
            packets, even if volume stays unchanged. Strict mode requires three
            separate volume increases after flushing, as in version 1.0.
          default: batch
          selector:
            select:
              options:
                - label: Batched volume reports
                  value: batch
                - label: Strict flow samples
                  value: strict
        confirmation_span:
          name: Batched mode confirmation time
          description: >-
            Three fresh observations, including the flushed reading, must span
            this time and stay within the temperature range. Keep shorter than
            the flow pause. A rejected window needs another volume increase.
          default: 30
          selector:
            number: {min: 10, max: 120, step: 1, unit_of_measurement: s, mode: box}
        flush_litres:
          name: Flush volume
          default: 5
          selector:
            number: {min: 0, max: 100, step: 0.1, unit_of_measurement: L, mode: box}
        settle_range:
          name: Maximum temperature range
          default: 0.2
          selector:
            number: {min: 0.01, max: 5, step: 0.01, unit_of_measurement: "°C", mode: box}
        settle_span:
          name: Strict mode minimum span of three readings
          description: >-
            In strict mode only volume increases produce candidates. They are spaced by
            at least half this span so fast updates cannot fill the window too early.
          default: 90
          selector:
            number: {min: 10, max: 600, step: 1, unit_of_measurement: s, mode: box}
    long_idle_guard:
      name: Long-idle guard
      collapsed: true
      input:
        long_idle_hours:
          name: Arm after no water use
          description: >-
            Hours since the last positive volume increase. Set 0 to disable.
            Unknown flow history starts guarded. Small draws do not disarm it.
          default: 3
          selector:
            number: {min: 0, max: 168, step: 0.5, unit_of_measurement: h, mode: box}
        guarded_flush_litres:
          name: Guarded flush volume
          description: >-
            Required volume within one water-use session while guarded.
            The effective threshold is never lower than the normal flush volume.
          default: 10
          selector:
            number: {min: 0, max: 500, step: 0.1, unit_of_measurement: L, mode: box}
        guarded_delay:
          name: Exclude initial readings for
          description: >-
            Seconds from the first volume increase of the guarded session.
            A subsequent volume increase at or after this delay must arrive
            before a confirmation window can open. Waiting alone cannot qualify.
          default: 120
          selector:
            number: {min: 0, max: 1800, step: 1, unit_of_measurement: s, mode: box}
        guarded_confirmation_span:
          name: Guarded confirmation time
          description: >-
            Stable fresh-observation span after the guarded volume/time gates.
            Strict mode uses at least its own minimum span. Keep shorter than
            the flow pause so a completed draw can still be confirmed.
          default: 30
          selector:
            number: {min: 10, max: 600, step: 1, unit_of_measurement: s, mode: box}
    timing:
      name: Pauses, missing data and freshness
      collapsed: true
      input:
        flow_pause:
          name: End water-use session after no volume increase
          description: A flow pause resets flushing; it is not a receiver outage.
          default: 150
          selector:
            number: {min: 30, max: 1800, step: 1, unit_of_measurement: s, mode: box}
        reception_timeout:
          name: Reception timeout
          description: >-
            With a receipt sensor, use its timestamp. Otherwise require silence
            in both source histories. Never count a cross-gap volume jump.
          default: 180
          selector:
            number: {min: 30, max: 3600, step: 1, unit_of_measurement: s, mode: box}
        freshness_hours:
          name: Accepted temperature freshness
          default: 24
          selector:
            number: {min: 1, max: 168, step: 1, unit_of_measurement: h, mode: box}

mode: queued
max: 25
max_exceeded: warning

triggers:
  - trigger: state
    entity_id: !input temperature_sensor
    id: reading
  - trigger: state
    entity_id: !input volume_sensor
    id: reading
  # An empty optional receipt selector matches no entity, rather than all entities.
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input receipt_sensor
    id: packet
  - trigger: time_pattern
    seconds: "/15"
    id: tick
  - trigger: time
    at: "00:00:00"
    id: midnight
  - trigger: homeassistant
    event: start
    id: reset
  - trigger: event
    event_type: automation_reloaded
    id: reset

actions:
  # Coalesce small write-order differences between the two source entities.
  # No state is read until the queued run begins, preventing lost updates.
  - delay:
      seconds: 2
  - variables:
      temperature_entity: !input temperature_sensor
      volume_entity: !input volume_sensor
      helper_entity: !input state_helper
      receipt_entity: !input receipt_sensor
      volume_factor: !input litres_per_unit
      flush: !input flush_litres
      tolerance: !input settle_range
      span: !input settle_span
      pause: !input flow_pause
      timeout: !input reception_timeout
      fresh_hours: !input freshness_hours
      sampling_mode: !input sampling_mode
      confirmation_span: !input confirmation_span
      idle_hours: !input long_idle_hours
      guarded_flush: !input guarded_flush_litres
      guarded_wait: !input guarded_delay
      guarded_span: !input guarded_confirmation_span
      event_kind: >-
        {{ 'reset' if trigger is not defined else
           'invalid' if trigger.platform | default('') == 'state'
             and trigger.to_state is not none
             and trigger.to_state.state in ['unknown', 'unavailable']
           else trigger.id | default('reset') }}
  - if:
      - "{{ states(helper_entity) == 'unavailable' or state_attr(helper_entity, 'max') | int(0) < 255 }}"
    then:
      - stop: State helper must exist, be available, and have maximum length 255.
        error: true
  - variables:
      next_state: >-
        {% set now_s = as_timestamp(now()) | int %}
        {% set day = now().strftime('%Y%m%d') | int %}
        {% set raw = states(helper_entity) | from_json(default={}) %}
        {% set old = raw if raw is mapping and raw.get('v') == 1 else {} %}
        {% set settings = [flush | float, tolerance | float, span | int,
                      pause | int, timeout | int, fresh_hours | float, volume_factor | float,
                      confirmation_span | int if sampling_mode == 'batch' else 0,
                      idle_hours | float, guarded_flush | float, guarded_wait | int, guarded_span | int] %}
        {% set packed = namespace(c=[]) %}
        {% for value in settings %}
          {% set packed.c = packed.c + [value | int if value == value | int else value] %}
        {% endfor %}
        {% set cfg = packed.c %}
        {% set a = old.get('a', []) %}
        {% if a is not sequence or a is string or a | length != 2
              or not is_number(a[0]) or not is_number(a[1]) %}{% set a = [] %}{% endif %}
        {% set d = old.get('d', []) %}
        {% if d is not sequence or d is string or d | length != 3
              or d[0] != day or not is_number(d[2]) %}{% set d = [day, none, 0] %}{% endif %}
        {% if d[1] is not none and not is_number(d[1]) %}{% set d = [day, none, 0] %}{% endif %}
        {% set q0 = old.get('q', []) %}
        {% set checked = namespace(q=[]) %}
        {% if q0 is sequence and q0 is not string and q0 is not mapping %}
          {% if sampling_mode == 'batch' %}
            {# Anchor time/temp, last spaced observation time, count, min, max. #}
            {% if q0 | length == 6 and is_number(q0[0]) and is_number(q0[1])
                  and is_number(q0[2]) and is_number(q0[3])
                  and is_number(q0[4]) and is_number(q0[5]) %}
              {% set base = old.get('f', 0) | int if 'h' in old else 0 %}
              {% set checked.q = [q0[0] + base, q0[1], q0[2] + base, q0[3], q0[4], q0[5]] %}
            {% endif %}
          {% else %}
            {% for pair in q0[-3:] %}
              {% if pair is sequence and pair is not string and pair | length == 2
                    and is_number(pair[0]) and is_number(pair[1]) %}
                {% set base = old.get('f', 0) | int if 'h' in old else 0 %}
                {% set checked.q = checked.q + [[(pair[0] | int) + base, pair[1] | float]] %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endif %}
        {% set s = namespace(p=old.get('p', 0) | float(0), r=old.get('r', 0) | int(0),
             f=old.get('f', 0) | int(0), l=old.get('l', 0) | float(0),
             b=old.get('b', 0) | int(0), z=old.get('z', 0) | int(0),
             h=old.get('h', 1 if idle_hours | float > 0 else 0) | int(1),
             q=checked.q, a=a, d=d, accepted=none, accepted_at=0) %}
        {# h: 0=unguarded, 1=armed, >1=first flow time of guarded session. #}
        {% if idle_hours | float <= 0 %}
          {% set s.h = 0 %}
        {% elif s.h == 0 and (s.f <= 0 or now_s - s.f >= idle_hours | float * 3600) %}
          {% set s.h = 1 %}{% set s.q = [] %}
        {% endif %}
        {% set temp = states(temperature_entity) %}
        {% set volume = states(volume_entity) %}
        {% set t_state = states[temperature_entity] %}
        {% set v_state = states[volume_entity] %}
        {% set heartbeat = receipt_entity is string and receipt_entity | length > 0 %}
        {% if heartbeat %}
          {% set received = as_timestamp(states(receipt_entity), 0) | int %}
        {% else %}
          {% set received = ([as_timestamp(t_state.last_updated, 0) if t_state is not none else 0,
                              as_timestamp(v_state.last_updated, 0) if v_state is not none else 0] | max) | int %}
        {% endif %}
        {% set available = is_number(temp) and is_number(volume)
             and temp | float >= -100 and temp | float <= 150
             and volume | float >= 0 and volume | float * volume_factor | float <= 1000000000000
             and received > 0 and -5 <= now_s - received <= timeout | int %}
        {% set config_changed = old.get('c') != cfg %}
        {% set restart = event_kind in ['reset', 'invalid'] or config_changed %}
        {% set gap = s.r > 0 and received - s.r > timeout | int %}
        {% if restart or not available or gap %}
          {% if s.b or restart %}{% set s.z = now_s %}{% endif %}
          {% set s.b = 0 %}{% set s.f = 0 %}{% set s.l = 0 %}{% set s.q = [] %}
          {% if idle_hours | float > 0 %}{% set s.h = 1 %}{% endif %}
          {% set s.r = 0 %}
        {% endif %}
        {% if available and not restart %}
          {% set litres = (volume | float * volume_factor | float) | round(3) %}
          {% if s.b == 0 %}
            {# A newly observed snapshot establishes the baseline; never count its jump. #}
            {% if received > s.z or gap %}
              {% set s.p = litres %}{% set s.r = received %}{% set s.b = 1 %}{% set s.z = 0 %}
            {% endif %}
          {% elif received >= s.r %}
            {% set fresh_observation = received > s.r %}
            {% set s.r = received %}
            {% set delta = (litres - s.p) | round(3) %}
            {% set s.p = litres %}
            {% if delta < 0 %}
              {# Counter reset: this value is the new baseline, not negative flow. #}
              {% set s.f = 0 %}{% set s.l = 0 %}{% set s.q = [] %}
              {% if idle_hours | float > 0 %}{% set s.h = 1 %}{% endif %}
            {% elif delta > 0 %}
              {% set flow_at = as_timestamp(v_state.last_updated, now_s) | int %}
              {% if s.f == 0 or flow_at - s.f > pause | int %}
                {% set s.l = 0 %}{% set s.q = [] %}
                {% if s.h > 0 %}{% set s.h = 1 %}{% endif %}
              {% endif %}
              {% if s.h == 1 %}{% set s.h = flow_at %}{% endif %}
              {% set s.f = flow_at %}
              {% set s.l = (s.l + delta) | round(3) %}
              {% set required_flush = [flush | float, guarded_flush | float] | max if s.h > 0 else flush | float %}
              {% set ready = s.h == 0 or flow_at - s.h >= guarded_wait | int %}
              {% set strict_span = [span | int, guarded_span | int] | max if s.h > 0 else span | int %}
              {% if s.l >= required_flush and ready %}
                {% if sampling_mode == 'batch' %}
                  {# Only real volume increases may open a confirmation window. #}
                  {% if s.q | length == 0 %}
                    {% set value = temp | float | round(2) %}
                    {% set s.q = [flow_at, value, flow_at, 1, value, value] %}
                  {% endif %}
                {% elif s.q | length == 0 or flow_at - s.q[-1][0] >= strict_span / 2 %}
                  {% set s.q = (s.q + [[flow_at, temp | float | round(2)]])[-3:] %}
                  {% if s.q | length == 3 and s.q[-1][0] - s.q[0][0] >= strict_span %}
                    {% set values = s.q | map(attribute=1) | list | sort %}
                    {% if values[-1] - values[0] <= tolerance | float + 0.000001 %}
                      {% set s.accepted = values[1] %}{% set s.accepted_at = flow_at %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endif %}
            {% if sampling_mode == 'batch' and fresh_observation and s.q | length > 0
                  and s.f > 0 and 0 <= now_s - s.f <= pause | int %}
              {% set confirm_for = guarded_span | int if s.h > 0 else confirmation_span | int %}
              {% set low = [s.q[4], temp | float | round(2)] | min %}
              {% set high = [s.q[5], temp | float | round(2)] | max %}
              {% set s.q = s.q[:4] + [low, high] %}
              {% if high - low > tolerance | float + 0.000001 %}
                {# Do not slide a rejected window into a later idle plateau. #}
                {% set s.q = [] %}
              {% elif received - s.q[2] >= confirm_for / 2 %}
                {% set s.q = s.q[:2] + [received, s.q[3] | int + 1, low, high] %}
                {% if s.q[3] >= 3 and received - s.q[0] >= confirm_for %}
                  {# Confirm the flow-linked reading; never publish a warmed idle sample. #}
                  {% set s.accepted = s.q[1] %}{% set s.accepted_at = s.q[0] %}
                  {% set s.q = [] %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endif %}
        {% if s.accepted is not none %}
          {% set s.h = 0 %}
          {% set s.a = [s.accepted_at, s.accepted] %}
          {% if as_local(as_datetime(s.accepted_at)).strftime('%Y%m%d') | int == day %}
            {% set minimum = s.accepted if s.d[1] is none else [s.d[1], s.accepted] | min %}
            {% set s.d = [day, minimum, s.d[2] | int + 1] %}
          {% endif %}
        {% endif %}
        {% if s.f > 0 and now_s - s.f > pause | int %}
          {% set s.l = 0 %}{% set s.q = [] %}
          {% if s.h > 0 %}{% set s.h = 1 %}{% endif %}
        {% endif %}
        {# Store candidate times as offsets from persistent last-flow time to fit 255 characters. #}
        {% set encoded_q = namespace(q=[]) %}
        {% if s.q | length > 0 %}
          {% if sampling_mode == 'batch' %}
            {% set encoded_q.q = [s.q[0] - s.f, s.q[1], s.q[2] - s.f, s.q[3], s.q[4], s.q[5]] %}
          {% else %}
            {% for pair in s.q %}{% set encoded_q.q = encoded_q.q + [[pair[0] - s.f, pair[1]]] %}{% endfor %}
          {% endif %}
        {% endif %}
        {{ {'v':1,'p':s.p,'r':s.r,'f':s.f,'l':s.l,'b':s.b,'z':s.z,
            'h':s.h,'q':encoded_q.q,'a':s.a,'d':s.d,'c':cfg} }}
  - variables:
      encoded_state: "{{ next_state | to_json | replace(', ', ',') | replace(': ', ':') }}"
  - if:
      - "{{ encoded_state | string | length > 255 }}"
    then:
      - stop: Estimator state exceeds 255 characters; previous state has been preserved.
        error: true
  - if:
      - "{{ states(helper_entity) != encoded_state }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: !input state_helper
        data:
          value: "{{ encoded_state }}"
