blueprint:
  name: Last measured incoming water temperature
  description: Display sensor for the flow-qualified water-temperature automation. Reads its single Text
    helper. Version 1.0.0.
  domain: template
  author: Andre Kuehne
  source_url: https://github.com/andrekuehne/ha_cold_water_temperature/blob/main/blueprints/template/cold_water_temperature.yaml
  homeassistant:
    min_version: 2024.11.0
  input:
    state_helper:
      name: Estimator state helper
      selector:
        entity:
          filter:
            domain: input_text
    name:
      name: Sensor name
      default: Incoming water temperature
      selector:
        text: null
variables:
  helper_entity: !input 'state_helper'
sensor:
  name: !input 'name'
  device_class: temperature
  unit_of_measurement: °C
  availability: '{% set s = states(helper_entity) | from_json(default={}) %} {{ s is mapping and s.get(''v'')
    == 1 and s.get(''a'', []) | length == 2 }}'
  state: '{% set s = states(helper_entity) | from_json(default={}) %} {{ s.get(''a'', [none, none])[1]
    if s is mapping and s.get(''a'', []) | length == 2 else none }}'
  attributes:
    measured_at: '{% set s = states(helper_entity) | from_json(default={}) %} {{ as_datetime(s.a[0]).isoformat()
      if s is mapping and s.get(''a'', []) | length == 2 else none }}'
    age_hours: "{% set s = states(helper_entity) | from_json(default={}) %} {{ ((as_timestamp(now()) -\
      \ s.a[0]) / 3600) | round(2)\n   if s is mapping and s.get('a', []) | length == 2 else none }}"
    fresh: "{% set s = states(helper_entity) | from_json(default={}) %} {{ s is mapping and s.get('a',\
      \ []) | length == 2 and s.get('c', []) | length >= 6\n   and 0 <= as_timestamp(now()) - s.a[0] <\
      \ s.c[5] * 3600 }}"
    reception_healthy: "{% set s = states(helper_entity) | from_json(default={}) %} {{ s is mapping and\
      \ s.get('b', 0) == 1 and s.get('c', []) | length >= 5\n   and 0 <= as_timestamp(now()) - s.get('r',\
      \ 0) <= s.c[4] }}"
    last_observed_at: '{% set s = states(helper_entity) | from_json(default={}) %} {{ as_datetime(s.r).isoformat()
      if s is mapping and s.get(''r'', 0) > 0 else none }}'
    status: "{% set s = states(helper_entity) | from_json(default={}) %} {% if s is not mapping or s.get('b',\
      \ 0) == 0 or s.get('c', []) | length < 5 %}\n  waiting_for_data\n{% elif as_timestamp(now()) - s.get('r',\
      \ 0) > s.c[4] %}\n  waiting_for_data\n{% elif s.get('f', 0) == 0 or as_timestamp(now()) - s.f >\
      \ s.c[3] %}\n  idle\n{% elif s.get('l', 0) < s.c[0] %}\n  flushing\n{% else %}\n  sampling\n{% endif\
      \ %}"
    flushed_litres: '{% set s = states(helper_entity) | from_json(default={}) %} {{ s.get(''l'', 0) if
      s is mapping else 0 }}'
